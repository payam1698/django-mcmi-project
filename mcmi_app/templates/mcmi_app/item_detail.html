{% extends 'mcmi_app/base.html' %}

{% block title %}Item Detail{% endblock %}

{% block content %}
<h2>{{ item.name }}</h2>
<p>{{ item.description }}</p>
<a href="{% url 'item_list' %}">Back to list</a>
<a href="{% url 'item_update' item.pk %}">Edit</a>
<a href="{% url 'item_delete' item.pk %}">Delete</a>
{% endblock %}
